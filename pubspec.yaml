name: ajan
description: "Dusunebilen, telefonda komut calistirabilen kisisel yapay zeka ajani."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  http: ^1.2.2
  shared_preferences: ^2.3.2
  uuid: ^4.5.0
  intl: ^0.19.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  path_provider: ^2.1.4
  # Yerel (offline) GGUF modelleri calistiran motor (llama.cpp).
  fllama:
    git:
      url: https://github.com/Telosnex/fllama.git
      ref: main

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
