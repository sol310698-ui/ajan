name: Build APK

on:
  push:
    branches: [ main, 'claude/**' ]
    tags: [ 'v*' ]
  workflow_dispatch:

# Release olusturabilmek icin yazma izni.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Repo sadece lib/ + android ozel dosyalari iceriyorsa,
      # eksik gradle/ios iskeletini flutter create ile tamamla.
      - name: Proje iskeletini tamamla
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            echo "Gradle bulunamadi -> flutter create ile tamamlaniyor"
            mkdir -p /tmp/base
            flutter create --org com.sametdemiral --project-name ajan --platforms android /tmp/base
            # Uretilen iskeleti kopyala AMA bizim lib/, pubspec, manifest, kotlin dosyalarini KORU
            cp -rn /tmp/base/android/. android/ 2>/dev/null || true
            cp -n /tmp/base/analysis_options.yaml . 2>/dev/null || true
            cp -n /tmp/base/.metadata . 2>/dev/null || true
          fi

      - name: Kotlin coroutines bagimliligini garantiye al
        run: |
          GRADLE=android/app/build.gradle
          if [ -f "$GRADLE" ] && ! grep -q "kotlinx-coroutines-android" "$GRADLE"; then
            sed -i '/dependencies {/a\    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"' "$GRADLE"
          fi

      - name: applicationId'yi ayarla
        run: |
          GRADLE=android/app/build.gradle
          if [ -f "$GRADLE" ]; then
            sed -i 's/applicationId "[^"]*"/applicationId "com.sametdemiral.ajan"/' "$GRADLE"
          fi

      - name: Bagimliliklar
        run: flutter pub get

      - name: Keystore'u coz (opsiyonel imzalama)
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
          cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      # key.properties varsa (yani imza secret'lari eklenmisse) release
      # imzalamayi build.gradle'a enjekte et. Secret yoksa bu adim atlanir ve
      # build eskisi gibi debug imzayla yesil kalir.
      - name: Imzalama yapilandirmasini enjekte et
        run: |
          python3 - <<'PY'
          import os, re
          if not os.path.exists("android/key.properties"):
              print("key.properties yok -> imzalama atlandi (debug imza).")
              raise SystemExit(0)

          groovy = "android/app/build.gradle"
          kts = "android/app/build.gradle.kts"
          path = groovy if os.path.exists(groovy) else (kts if os.path.exists(kts) else None)
          if path is None:
              print("build.gradle bulunamadi!"); raise SystemExit(1)

          src = open(path, encoding="utf-8").read()
          if "ajanReleaseSigning" in src:
              print("zaten imzali yapilandirilmis."); raise SystemExit(0)

          is_kts = path.endswith(".kts")
          idx = src.find("android {")
          if idx == -1:
              print("android bloku bulunamadi!"); raise SystemExit(1)

          if is_kts:
              loader = (
                  '\n// ajanReleaseSigning\n'
                  'val keystoreProperties = java.util.Properties()\n'
                  'val keystorePropertiesFile = rootProject.file("key.properties")\n'
                  'if (keystorePropertiesFile.exists()) { keystorePropertiesFile.inputStream().use { keystoreProperties.load(it) } }\n'
              )
              signing = (
                  '\n    signingConfigs {\n'
                  '        create("release") {\n'
                  '            storeFile = file(keystoreProperties["storeFile"] as String)\n'
                  '            storePassword = keystoreProperties["storePassword"] as String\n'
                  '            keyAlias = keystoreProperties["keyAlias"] as String\n'
                  '            keyPassword = keystoreProperties["keyPassword"] as String\n'
                  '        }\n'
                  '    }\n'
              )
              src = src[:idx] + loader + src[idx:]
              idx = src.find("android {") + len("android {")
              src = src[:idx] + signing + src[idx:]
              src = src.replace('signingConfig = signingConfigs.getByName("debug")',
                                'signingConfig = signingConfigs.getByName("release")')
          else:
              loader = (
                  '\n// ajanReleaseSigning\n'
                  'def keystoreProperties = new Properties()\n'
                  'def keystorePropertiesFile = rootProject.file("key.properties")\n'
                  'if (keystorePropertiesFile.exists()) { keystorePropertiesFile.withInputStream { keystoreProperties.load(it) } }\n'
              )
              signing = (
                  '\n    signingConfigs {\n'
                  '        release {\n'
                  '            storeFile file(keystoreProperties["storeFile"])\n'
                  '            storePassword keystoreProperties["storePassword"]\n'
                  '            keyAlias keystoreProperties["keyAlias"]\n'
                  '            keyPassword keystoreProperties["keyPassword"]\n'
                  '        }\n'
                  '    }\n'
              )
              src = src[:idx] + loader + src[idx:]
              idx = src.find("android {") + len("android {")
              src = src[:idx] + signing + src[idx:]
              src = src.replace("signingConfig signingConfigs.debug",
                                "signingConfig signingConfigs.release")

          open(path, "w", encoding="utf-8").write(src)
          print("Release imzalama enjekte edildi:", path)
          PY

      # MediaPipe (flutter_gemma) R8 kod-kucultmede 'Missing class' hatasi
      # veriyor. Yan yuklenen uygulamada minify gereksiz; release'te kapatiyoruz.
      - name: R8/minify kapat (yerel model uyumu)
        run: |
          python3 - <<'PY'
          import os, re
          for path in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              if not os.path.exists(path):
                  continue
              src = open(path, encoding="utf-8").read()
              if "ajanNoMinify" in src:
                  continue
              is_kts = path.endswith(".kts")
              bt = re.search(r"buildTypes\s*\{", src)
              if not bt:
                  continue
              rel = re.search(r"release\s*\{", src[bt.end():])
              if not rel:
                  continue
              pos = bt.end() + rel.end()
              if is_kts:
                  ins = "\n            isMinifyEnabled = false\n            isShrinkResources = false // ajanNoMinify\n"
              else:
                  ins = "\n            minifyEnabled false\n            shrinkResources false // ajanNoMinify\n"
              src = src[:pos] + ins + src[pos:]
              open(path, "w", encoding="utf-8").write(src)
              print("R8/minify kapatildi:", path)
          PY

      - name: APK uret (arm64)
        run: flutter build apk --release --target-platform android-arm64

      - name: APK'yi yeniden adlandir
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/ajan-arm64.apk

      - name: APK'yi yukle (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ajan-arm64-release
          path: dist/ajan-arm64.apk

      # Her push'ta guncellenen bir Release: sadece APK.
      - name: Release yayinla (sadece APK)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ajan APK (build ${{ github.run_number }})
          body: |
            Otomatik derlenen arm64 APK.
            Kurulum: telefona indir, "bilinmeyen kaynaklar"a izin ver, kur.
          files: dist/ajan-arm64.apk
          make_latest: true
